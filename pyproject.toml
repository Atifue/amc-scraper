[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "amc-scraper"
version = "0.1.0"
description = "Discord bot that lists daily showtimes for AMC Fresh Meadows 7 and AMC Bay Terrace 6"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4,<3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "playwright>=1.45",
]

[project.scripts]
amc-showtimes = "amc_scraper.__main__:main"
amc-bot = "amc_scraper.bot:main"

[tool.setuptools.packages.find]
where = ["src"]
